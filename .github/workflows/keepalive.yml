# Keep the free-tier Supabase project awake.
#
# AIDebate's Supabase runs on the free plan, which pauses a project after
# ~7 days with no database activity — and a paused DB is what took the live
# site down (every /api/debates -> "fetch failed"). This pings the public
# debates API (which issues a REAL authenticated DB query, the kind that
# actually resets the idle timer) twice a week, well under the 7-day window,
# so the project never sleeps.
#
# Zero cost, no secrets. If AIDebate ever moves to a paid Supabase org
# (which doesn't pause), this workflow can simply be deleted.
name: keepalive

on:
  schedule:
    - cron: '0 8 * * 1,4'   # Mondays & Thursdays 08:00 UTC (max ~4-day gap)
  workflow_dispatch: {}       # allow a manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the DB via the public debates API
        env:
          URL: https://www.aidebate.io/api/debates
        run: |
          # Retry a few times: a project waking from pause has a cold start,
          # so the first hit can 5xx before the origin is ready. We only need
          # ONE successful authenticated query to reset the idle timer.
          ok=0
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            # A real payload is {"debates":[...]}; a paused/erroring DB returns
            # an {"error":...} body or an HTML 5xx page.
            if [ "$code" = "200" ] && grep -q '"debates"' /tmp/out.json; then
              n=$(grep -o '"id"' /tmp/out.json | wc -l | tr -d ' ')
              echo "attempt $attempt: HTTP 200, DB query OK (~$n debates)"
              ok=1
              break
            fi
            echo "attempt $attempt: HTTP $code (DB still waking or erroring), retrying in 20s..."
            head -c 200 /tmp/out.json 2>/dev/null || true
            echo ""
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::keepalive could not confirm a live DB query after 5 attempts — the project may be paused or the site may be down. Check aidebate.io."
          fi
