# Keep the free-tier Supabase project awake.
#
# AIDebate's Supabase runs on the free plan, which pauses a project after
# ~7 days with no database activity — and a paused DB is what took the live
# site down (every /api/debates → "fetch failed"). This pings the public
# debates API (which issues a real DB query) twice a week, well under the
# 7-day idle window, so the project never sleeps.
#
# Zero cost, no secrets. If AIDebate ever moves to a paid Supabase org
# (which doesn't pause), this workflow can simply be deleted.
name: keepalive

on:
  schedule:
    - cron: '0 8 * * 1,4'   # Mondays & Thursdays 08:00 UTC (max ~4-day gap)
  workflow_dispatch: {}       # allow a manual run

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the DB via the public debates API
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 30 https://www.aidebate.io/api/debates || echo 000)
          echo "GET /api/debates -> HTTP $code"
          head -c 300 /tmp/out.json || true
          # Non-fatal: a hiccup on one ping shouldn't fail the schedule.
          if [ "$code" != "200" ]; then
            echo "::warning::keepalive ping returned $code (a paused DB or a transient error)"
          fi
